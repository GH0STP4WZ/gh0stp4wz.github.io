<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="/assets/CSS/global.css" />
  <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
  <link rel="icon" href="{{profilePicture}}" type="image/x-icon" />
  <title>Blog | {{siteTitle}}</title>
  <meta content="GH0STP4WZ's Site" property="og:title" />
  <meta content="This is GH0STP4WZ's blog." property="og:description" />
  <meta content="https://gh0stp4wz.github.io/blog" property="og:url" />
  <meta content="{{profilePicture}}" property="og:image" />
  <meta content="{{themeColor}}" data-react-helmet="true" name="theme-color" />
</head>
<body>
  <!-- Navigation -->
  <div class="navbar">
    <div class="nav-container">
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/links">Links</a>
        <a href="/blog" class="active-tab">Blog</a>
        <a href="/downloads-pages/">Downloads</a>
        <a href="/ikw/">IKW Rooms</a>
      </div>
    </div>
  </div>
  
  <!-- Main Content -->
  <div class="container">
    <!-- <div class="card"> -->
      <div class="header">
        <img
          class="profile-picture"
          src="{{profilePicture}}"
          alt="Profile Picture"
        />
        <h1>Auroras Blog</h1>
      </div>
    <!-- </div> -->
      <div class="card">
        <div class="vhs-lines"></div>
        <div class="glitch-bars" id="glitch-bars"></div>
        <div class="card-ribbon"></div>
        <div class="faux-titlebar">
          <h2 class="section-title">Blog_Posts.md</h2>
          <div class="faux-controls">
            <i class="control-btn nf-md-window_minimize"></i>
            <i class="control-btn nf-md-window_maximize"></i>
            <i class="control-btn nf-md-window_close"></i>
          </div>
        </div>
      <div id="page-content">
        <div class="blog-headline">
          <h2>Welcome to my blog! These are my posts, sorted from newest to oldest:</h2>
        </div>
        <section id="blog-posts">
          {{posts}}
        </section>
      </div>
    </div>
  </div>
  
  <!-- Footer -->
  <div class="footer">
    <p>&copy; 2026 Aurora "GH0STP4WZ" Hartman</p>
    <p>Made with ❤️ and 🏳️‍⚧️ rights</p>
  </div>

  <script>
    // Add animation order to blog post cards
    document.querySelectorAll('.blog-post-card').forEach((card, index) => {
      card.style.setProperty('--animation-order', index);
    });
  </script>
</body>
</html>
