<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="/assets/CSS/global.css" />
    <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
    <link rel="icon" href="{{profilePicture}}" type="image/x-icon" />
    <title>{{title}} | {{siteTitle}}</title>
    <meta content="GH0STP4WZ's Blog" property="og:title" />
    <meta content="{{title}}" property="og:description" />
    <meta content="https://gh0stp4wz.github.io/blog/blog-posts/{{filename}}" property="og:url" />
    <meta content="{{profilePicture}}" property="og:image" />
    <meta content="{{themeColor}}" data-react-helmet="true" name="theme-color" />
  </head>
  <body>
  <div class="navbar">
    <div class="nav-container">
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/links">Links</a>
        <a href="/blog" class="active-tab">Blog</a>
        <a href="/downloads-pages/">Downloads</a>
        <a href="/ikw/">IKW Rooms</a>
      </div>
    </div>
  </div>
    
    <div class="container blog-page-container">
      <div class="card blog-page-card">
        <div class="faux-titlebar">
          <h2 class="section-title">{{title}}.md</h2>
          <div class="faux-controls">
            <i class="control-btn nf-md-window_minimize"></i>
            <i class="control-btn nf-md-window_maximize"></i>
            <i class="control-btn nf-md-window_close"></i>
          </div>
        </div>

        <div class="blog-header">
          <p>{{date}}{{lastUpdatedDisplay}} | {{author}}</p>
        </div>
        <div class="blog-seperator"></div>
        <div class="blog-post">
          {{content}}
        </div>
      </div>
      <section id="footer">
        <a href="/blog/">Back to post browser</a>
      </section>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>&copy; 2026 Aurora "GH0STP4WZ" Hartman</p>
      <p>Made with ❤️ and 🏳️‍⚧️ rights</p>
    </div>
  </body>
</html>
